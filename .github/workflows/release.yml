name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # A tag pushed with the workflow token wouldn't start this workflow, so the button picks the version here.
      - name: Pick the version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            exit 0
          fi
          [[ $GITHUB_REF == refs/heads/main ]] || { echo "::error::Release from main only."; exit 1; }
          latest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
          case $BUMP in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            *) next="$major.$minor.$((patch + 1))" ;;
          esac
          echo "Releasing v$next (latest was v${latest:-none})"
          echo "VERSION=v$next" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Build
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Overrides Signing.xcconfig's ad-hoc identity; notarization needs the timestamp and rejects get-task-allow.
        run: |
          xcodebuild -project CocoNotch.xcodeproj -scheme CocoNotch -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build build -quiet \
            CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS=--timestamp CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            MARKETING_VERSION="${VERSION#v}" CURRENT_PROJECT_VERSION="${VERSION#v}"
          # Xcode re-signs Sparkle.framework but leaves its helpers ad-hoc, which notarization rejects. Inside out.
          app=build/Build/Products/Release/CocoNotch.app
          fw="$app/Contents/Frameworks/Sparkle.framework"
          for code in "$fw"/Versions/B/XPCServices/*.xpc "$fw/Versions/B/Autoupdate" "$fw/Versions/B/Updater.app" "$fw" "$app"; do
            codesign -f -s "Developer ID Application" -o runtime --timestamp --preserve-metadata=entitlements "$code"
          done

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app=build/Build/Products/Release/CocoNotch.app
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/upload.zip"
          xcrun notarytool submit "$RUNNER_TEMP/upload.zip" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "$app"
          mkdir dist
          ditto -c -k --keepParent "$app" "dist/CocoNotch-${VERSION#v}.zip"

      # The app reads releases/latest/download/appcast.xml, so each release only needs its own entry.
      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$VERSION/" dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "dist/CocoNotch-${VERSION#v}.zip" dist/appcast.xml \
            --target "$GITHUB_SHA" --generate-notes

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          sha=$(shasum -a 256 "dist/CocoNotch-${VERSION#v}.zip" | cut -d' ' -f1)
          git clone "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/coconotch.rb <<EOF
          cask "coconotch" do
            version "${VERSION#v}"
            sha256 "$sha"

            url "https://github.com/$GITHUB_REPOSITORY/releases/download/v#{version}/CocoNotch-#{version}.zip"
            name "CocoNotch"
            desc "Notch and menu bar widget hub"
            homepage "https://github.com/$GITHUB_REPOSITORY"

            auto_updates true
            depends_on macos: ">= :sequoia"

            app "CocoNotch.app"

            zap trash: [
              "~/Library/Application Support/CocoNotch",
              "~/Library/Preferences/io.github.juangarcia-ts.CocoNotch.plist",
            ]
          end
          EOF
          cd tap
          git add Casks/coconotch.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "coconotch ${VERSION#v}"
          git push
