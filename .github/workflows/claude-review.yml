name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Dependabot PRs get no repo secrets, so the review could not sign in.
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against the rules in CLAUDE.md. For each finding, say what breaks and why it matters.

            This review runs again on every push. First read what is already on the PR:
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
            for inline comments and `gh pr view ${{ github.event.pull_request.number }} --comments` for the rest.
            Never post a finding that an existing comment already covers, even reworded, and never post
            the same finding twice in this run. Only review what the latest push changed or still leaves open.

            Look for, in order:
            1. Bugs: wrong logic, crashes, data races, retain cycles, main-thread blocking.
            2. Logic that belongs in CocoNotchCore but sits in a view, or logic without a test.
            3. Over-engineering: abstractions, helpers or dependencies the change does not need.
            4. Missing edge cases: no notch, several displays, empty or missing data, permissions denied.

            Formatting, lint and build are already checked by CI; do not comment on them.
            Use inline comments for specific lines.

            Always end the run with exactly one top-level comment posted with `gh pr comment`, even when
            you found nothing new. Start it with "**Verdict: ready to merge**" or "**Verdict: needs changes**",
            then list only the open findings that block merging, one line each.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments)"
